# The MCP server: the world, exposed to any assistant that speaks the protocol.
#
# Tools are declared with #[McpTool] on the services in App\Mcp and autoconfigured by the bundle,
# so there is no list to keep in step here.
mcp:
    servers:
        default:
            # Scoped to our own namespace rather than '*', which would also expose whatever
            # third-party bundles happen to register.
            registry: 'App\Mcp\'

            transports:
                # STDIO only. Desktop clients launch the server as a child process and talk over
                # pipes, so they are already authenticated by being able to start it at all.
                #
                # The HTTP transport is deliberately off. It has no authentication of its own,
                # and three of our tools change the running world — binding that to a local port
                # would let any process on the machine, or any page that can reach localhost,
                # order bots about. If we ever want it (a web cockpit), it needs a firewall and
                # a role in front of it first, not just a path.
                stdio: true

                # Off explicitly: the bundle defaults this to TRUE, so omitting it leaves
                # /mcp/default routed and answering.
                http: false
